<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Formularz z Walidacją i Generatorem XML</title>
  
  <link rel="stylesheet" href="styl.css">
</head>
<body>

  <div class="formularz">
    <h1>Formularz rejestracyjny</h1>
    
    <form id="rejestracjaForm" method="post" novalidate>

      <div class="pole-formularza">
        <label for="imie">Imię:</label>
        <input type="text" id="imie" name="imie" value="Jan">
        <div class="error-message" id="imie-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="nazwisko">Nazwisko:</label>
        <input type="text" id="nazwisko" name="nazwisko" value="Kowalski">
        <div class="error-message" id="nazwisko-error"></div>
      </div>

      <div class="pole-formularza">
        <label>Płeć:</label>
        <div class="grupa-radio">
          <label><input type="radio" name="plec" value="kobieta"> Kobieta</label>
          <label><input type="radio" name="plec" value="mezczyzna" checked> Mężczyzna</label>
          <label><input type="radio" name="plec" value="inna"> Inna</label>
        </div>
        <div class="error-message" id="plec-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="data_urodzenia">Data urodzenia:</label>
        <input type="date" id="data_urodzenia" name="data_urodzenia" value="1990-01-01">
        <div class="error-message" id="data_urodzenia-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="haslo">Hasło:</label>
        <input type="password" id="haslo" name="haslo" value="Testowe123">
        <div class="error-message" id="haslo-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="wojewodztwo">Województwo:</label>
        <select id="wojewodztwo" name="wojewodztwo">
          <option value="">--Wybierz--</option>
          <option value="mazowieckie" selected>Mazowieckie</option>
          <option value="dolnoslaskie">Dolnośląskie</option>
          <option value="kujawsko-pomorskie">Kujawsko-pomorskie</option>
          <option value="lubelskie">Lubelskie</option>
          <option value="lubuskie">Lubuskie</option>
          <option value="łódzkie">Łódzkie</option>
          <option value="małopolskie">Małopolskie</option>
          <option value="opolskie">Opolskie</option>
          <option value="podkarpackie">Podkarpackie</option>
          <option value="podlaskie">Podlaskie</option>
          <option value="pomorskie">Pomorskie</option>
          <option value="śląskie">Śląskie</option>
          <option value="świętokrzyskie">Świętokrzyskie</option>
          <option value="warminsko-mazurskie">Warmińsko-mazurskie</option>
          <option value="wielkopolskie">Wielkopolskie</option>
          <option value="zachodniopomorskie">Zachodniopomorskie</option>
        </select>
        <div class="error-message" id="wojewodztwo-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="miasto">Miasto:</label>
        <input type="text" id="miasto" name="miasto" value="Warszawa">
        <div class="error-message" id="miasto-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="ulica">Ulica i numer:</label>
        <input type="text" id="ulica" name="ulica" value="Marszałkowska 1">
        <div class="error-message" id="ulica-error"></div>
      </div>
      
      <div class="pole-formularza">
        <label for="kod_pocztowy">Kod pocztowy:</label>
        <input type="text" id="kod_pocztowy" name="kod_pocztowy" placeholder="np. 00-123" value="00-456">
        <div class="error-message" id="kod_pocztowy-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="telefon">Telefon:</label>
        <input type="tel" id="telefon" name="telefon" placeholder="np. 123456789" value="123456789">
        <div class="error-message" id="telefon-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" value="jan.kowalski@example.com">
        <div class="error-message" id="email-error"></div>
      </div>

      <div class="pole-formularza">
        <label>Prawo jazdy:</label>
        <div class="grupa-radio">
          <label><input type="radio" name="prawo_jazdy" value="tak" checked> Tak</label>
          <label><input type="radio" name="prawo_jazdy" value="nie"> Nie</label>
        </div>
        <div class="error-message" id="prawo_jazdy-error"></div>
      </div>

      <div class="pole-formularza">
        <label for="uwagi">Uwagi (opcjonalne):</label>
        <textarea id="uwagi" name="uwagi" rows="4" maxlength="200">To są przykładowe uwagi.</textarea>
        <div class="error-message" id="uwagi-error"></div>
      </div>
      
      <div class="pole-formularza">
          <button type="submit">Zarejestruj i Generuj XML</button>
      </div>

    </form>
  </div>

  <script src="skrypt_formularz_faktura.js"></script>

</body>
</html>
