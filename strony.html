<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Strona z Linkami</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6; 
            margin: 0;
            padding: 20px; 
            display: flex;
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh;
        }

        
        .container {
            width: 100%;
            max-width: 600px; 
            margin: 20px;
            background: #ffffff; 
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
            padding: 24px 32px;
            box-sizing: border-box;
        }

       
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
        }

        
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 12px; 
        }

        
        li a {
            display: block; 
            padding: 16px 20px;
            background-color: #fafafa; 
            border: 1px solid #eee; 
            border-radius: 8px; 
            text-decoration: none; 
            color: #007bff; 
            font-weight: 600; 
            
            
            transition: all 0.2s ease-in-out;
        }

        
        li a:hover {
            background-color: #007bff; 
            color: #ffffff; 
            border-color: #007bff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Linki do Prac Domowych</h1>
        <ul>
            <li><a href="https://zannawalczak.github.io/pierwszastrona.html" target="_blank">Praca domowa 1</a></li>
            <li><a href="https://zannawalczak.github.io/kolumny.html" target="_blank">Praca domowa 2 - a </a></li>
            <li><a href="https://zannawalczak.github.io/formularz.html" target="_blank">Praca domowa 2 - b </a></li>
            <li><a href="https://zannawalczak.github.io/galeriaZdjec.html" target="_blank">Praca domowa 2 - c </a></li>
            <li><a href="https://zannawalczak.github.io/kolumnyCSS.html" target="_blank">Praca domowa 3 - a </a></li>
            <li><a href="https://zannawalczak.github.io/formularzCSS.html" target="_blank">Praca domowa 3 - b </a></li>
            <li><a href="https://zannawalczak.github.io/galeriaZdjecCSS.html" target="_blank">Praca domowa 3 - c </a></li>
            <li><a href="https://zannawalczak.github.io/kalkulator.html" target="_blank">Praca domowa 4 </a></li>
            <li><a href="https://zannawalczak.github.io/formularz_z_walidacja.html" target="_blank">Praca domowa 5 </a></li>
        </ul>
    </div>

</body>
</html>
